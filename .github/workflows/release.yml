name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-crate:
    name: publish-crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate release tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "Invalid release tag: ${GITHUB_REF_NAME}"; exit 1; }

      - name: Set version and publish crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          cargo check
          cargo publish --locked --allow-dirty
  docker-push:
    name: docker-push
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: docker-assets-linux-*
          path: ci/assets
          merge-multiple: true
      
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ravermeister/tunone
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Get the release version from the tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "version is: ${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${VERSION}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "release ${VERSION} already exists"
          else
            gh release create "${VERSION}" \
              --repo "${GH_REPO}" \
              --title "${VERSION}" \
              --verify-tag
          fi

  build-release:
    name: build-release
    needs: [ 'create-release' ]
    runs-on: ${{ matrix.os }}
    env:
      # Emit backtraces on panics.
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        build: [ linux-amd64, linux-arm64, linux-armv7, macos-aarch64, windows ]
        include:
          - build: linux-amd64
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-musl
            cross: false
          # Linux ARM targets require cross on GitHub-hosted runners.
          - build: linux-arm64
            os: ubuntu-latest
            rust: stable
            target: aarch64-unknown-linux-musl
            cross: true
          # Raspberry Pi 32-bit (ARMv7) requires cross on GitHub-hosted runners.
          - build: linux-armv7
            os: ubuntu-latest
            rust: stable
            target: armv7-unknown-linux-musleabihf
            cross: true
          - build: macos-aarch64
            os: macos-latest
            rust: stable
            target: aarch64-apple-darwin
            cross: false
          - build: windows
            os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc
            cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          .github/ci/ubuntu-install-packages
      - name: Install packages (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          .github/ci/macos-install-packages
      - name: Install Rust
        run: |
          rustup update ${{ matrix.rust }}
          rustup default ${{ matrix.rust }}
          rustup target add ${{ matrix.target }}

      - name: Set release version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "version is: ${GITHUB_REF_NAME}"

      - name: Build onetun binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo install cross --locked
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare tunone binary
        shell: bash
        run: |
          mkdir -p ci/assets
          if [ "${{ matrix.build }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/tunone.exe" "ci/assets/tunone.exe"
            echo "ASSET=tunone.exe" >> $GITHUB_ENV
          else
            cp "target/${{ matrix.target }}/release/tunone" "ci/assets/tunone-${{ matrix.build }}"
            echo "ASSET=tunone-${{ matrix.build }}" >> $GITHUB_ENV
          fi

      - name: Upload Linux binary for Docker build
        if: startsWith(matrix.build, 'linux-')
        uses: actions/upload-artifact@v4
        with:
          name: docker-assets-${{ matrix.build }}
          path: ci/assets/tunone-${{ matrix.build }}
          if-no-files-found: error

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "${VERSION}" "ci/assets/${ASSET}" --repo "${GH_REPO}" --clobber
