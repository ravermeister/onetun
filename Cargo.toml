[package]
name = "onetun"
version = "0.3.10"
edition = "2021"
license = "MIT"
description = "A cross-platform, user-space WireGuard port-forwarder that requires no system network configurations."
authors = ["Aram Peres <aram.peres@gmail.com>", "Jonny Rimkus <jonny@rimkus.it>"]
repository = "https://github.com/aramperes/onetun"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Required dependencies (bin and lib)
boringtun = { version = "0.7.1", default-features = false }
log = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["rt", "sync", "io-util", "net", "time", "fs", "macros"] }
futures = "0.3"
rand = "0.10"
nom = "8"
async-trait = "0.1"
priority-queue = "2.7"
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
bytes = "1"
base64 = "0.22.1"

# forward boringtuns tracing events to log
tracing = { version = "0.1", default-features = false, features = ["log"] }

# Human-friendly UTC timestamps for logging
chrono = "0.4"

# bin-only dependencies
clap = { version = "4.6.1", default-features = false, features = ["suggestions", "std", "env", "help", "wrap_help"], optional = true }
pretty_env_logger = { version = "0.5", optional = true }
async-recursion = "1.1"

[features]
pcap = []
default = ["bin"]
bin = ["clap", "pretty_env_logger", "pcap", "tokio/rt-multi-thread"]

[lib]
name = "onetun"

[profile.release]
opt-level = 2
# Conservative compilation settings for RAM-constrained systems.
# opt-level=2 provides good optimization without excessive memory use.
# Avoiding LTO, high codegen-units, and single-unit compilation to prevent OOM.
lto = false
codegen-units = 16
strip = true
split-debuginfo = "packed"

[profile.release-fast]
inherits = "release"
opt-level = 3
codegen-units = 4
# Use this profile on systems with abundant RAM:
# cargo build --release -p onetun --profile release-fast
# OR: CARGO_PROFILE_RELEASE_FAST_OPT_LEVEL=3 cargo build --release

[profile.release-minimal]
inherits = "release"
opt-level = 1
codegen-units = 256
# Use this profile on systems with severe RAM constraints (< 2GB):
# cargo build -p onetun --profile release-minimal

